<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediPulse</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>Abriendo MediPulse… Si no se abre, <a href="medipulse/">entra aquí</a>.</p>
<script>
// La app anterior (Flutter, exam_checker_app) dejó un service worker y su caché en algunos dispositivos.
// Se quitan antes de abrir MediPulse para que no vuelva a aparecer.
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      for (const r of await navigator.serviceWorker.getRegistrations()) if (!r.scope.endsWith("/medipulse/")) await r.unregister();
    }
    if (window.caches) for (const k of await caches.keys()) if (k.startsWith("flutter")) await caches.delete(k);
  } catch (e) {}
  location.replace("medipulse/");
})();
</script>
</body>
</html>
